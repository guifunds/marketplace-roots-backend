spring:
  datasource:
    url: jdbc:h2:mem:origem;MODE=PostgreSQL
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 3025

app:
  cors-allowed-origin: http://localhost:3000
  payments:
    demo-mode: true
  founding-fee:
    amount-cents-brl: 149000
    amount-cents-usd: 149000
  rate-limit:
    # Alto o bastante para não interferir com os testes de integração (que fazem várias
    # chamadas a POST /api/signups na mesma suíte).
    signups-per-minute: 1000

stripe:
  secret-key: ""
  webhook-secret: ""
